name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: tools/build_appimage.sh
      - name: Install the libraries Qt needs to start
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Real training from the package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 900 dist/Atlas_Engine-x86_64.AppImage --appimage-extract-and-run --selftest-train 2>&1 | tee selftest.log
          grep -q 'SELFTEST {"ok": true' selftest.log || { echo "::error::Linux self-test: $(grep -a SELFTEST selftest.log | cut -c1-600)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: dist/*.AppImage }
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: powershell -ExecutionPolicy Bypass -File tools/build_windows.ps1
      - name: Real training from the package
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\atlas-engine\atlas-engine.exe -ArgumentList "--selftest-train" -PassThru
          if (-not $p.WaitForExit(900000)) { $p.Kill(); Write-Output "::error::Windows self-test timed out"; exit 1 }
          $r = Get-Content "$env:LOCALAPPDATA\AtlasEngine\selftest_result.txt" -Raw
          Write-Output $r
          if ($r -notmatch '"ok": true') { Write-Output "::error::Windows self-test: $($r.Substring(0, [Math]::Min(600, $r.Length)))"; exit 1 }
      - uses: actions/upload-artifact@v4
        with: { name: windows-exe, path: dist/Atlas_Engine-windows-x64.zip }
  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" out/* --title "Atlas Engine $GITHUB_REF_NAME" --notes-file .github/release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}
